name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Maintenance and active LTS lines (ADR-0001).
        node: ['22.23.3', '24.21.0']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Reads the pnpm version from package.json's packageManager field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: master

      - run: pnpm nx format:check

      # The docs build photographs block previews for the landing page in
      # Chromium (ADR-0026).
      - run: pnpm exec playwright install --with-deps chromium

      # Pull requests run only what they affect; pushes to master run
      # everything, so a batch of commits can't skip projects.
      - if: github.event_name == 'pull_request'
        run: pnpm nx affected -t lint typecheck test build check

      - if: github.event_name == 'push'
        run: pnpm nx run-many -t lint typecheck test build check

      # The update merge suite (ADR-0020) needs no browser, but does depend
      # on Node, so it stays here.
      # nx affected has no --projects filter and would run every affected
      # e2e target here, so the affected check picks the project instead.
      - if: github.event_name == 'pull_request'
        run: |
          if pnpm nx show projects --affected --projects=update-fixtures --json | grep -q '"update-fixtures"'; then
            pnpm nx e2e update-fixtures
          else
            echo "No change affects the update merge suite."
          fi

      - if: github.event_name == 'push'
        run: pnpm nx run-many -t e2e --projects=update-fixtures

  # ADR-0028: a pull request that changes what a published package ships
  # needs a changeset; `changedFilePatterns` in .changeset/config.json says
  # which files ship. The version pull request is skipped: it consumes the
  # changesets and bumps every package.json.
  changeset:
    name: Changeset
    if: >-
      github.event_name == 'pull_request' &&
      !(startsWith(github.head_ref, 'changeset-release/') &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          if ! pnpm nx run @ndop/source:changeset-status --since="$BASE_REF"; then
            echo "::error title=Missing changeset::This pull request changes a published @ndop package but adds no changeset. Run 'pnpm changeset' and describe the change for the package's users, or 'pnpm changeset --empty' if they won't see it. See CONTRIBUTING.md, Releasing."
            exit 1
          fi

  # Browser tests depend on the browser, not on Node, so they run once, on
  # the active LTS, with one job per browser in parallel. They have their
  # own runners: the harness's dev server renders pages on demand, and
  # sharing a runner with lint, type-check and test tasks starved it past
  # Vite's 60s server-render limit. The docs' e2e runs against their
  # production build. The registry install test has its own job.
  e2e:
    name: E2E ${{ matrix.browser }} ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        # Two halves of each project's tests per browser (ADR-0029). The
        # crawls are single tests, so each lands whole in one half.
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: master

      # The docs build takes block thumbnails and OG images in Chromium
      # (ADR-0026), so every browser's job needs it to build the site.
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser == 'chromium' && 'chromium' || format('{0} chromium', matrix.browser) }}

      # Arguments after `--` reach every Playwright run, which keeps it to
      # this job's browser and half.
      # nx affected has no --projects filter, so the affected browser suites
      # are listed first and run with run-many.
      - if: github.event_name == 'pull_request'
        run: |
          projects=$(pnpm nx show projects --affected --projects=harness-e2e,docs-e2e --json | jq -r 'join(",")')
          if [ -n "$projects" ]; then
            pnpm nx run-many -t e2e --projects="$projects" -- --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/2
          else
            echo "No change affects the browser tests."
          fi

      - if: github.event_name == 'push'
        run: pnpm nx run-many -t e2e --projects=harness-e2e,docs-e2e -- --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/2

  # ADR-0021: every example, block and theme sheet against committed
  # baselines. The browser runs in Playwright's Docker image, so one job is
  # enough; it has its own runner so it runs beside the e2e jobs rather
  # than after one of them (ADR-0029). The Visual baselines workflow
  # writes the baselines.
  visual:
    name: Visual
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - if: hashFiles('apps/harness-e2e/src/visual/__screenshots__/**') != ''
        run: pnpm nx run harness-e2e:visual

  # ADR-0016: Lighthouse on every prerendered docs route, served the way
  # Cloudflare Pages serves it; any category under 95 fails. The routes are
  # shared out across parallel jobs, each on its own runner, so other tasks
  # don't skew the performance measurements.
  docs-lighthouse:
    name: Docs Lighthouse ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: master

      - run: pnpm exec playwright install --with-deps chromium

      - if: github.event_name == 'pull_request'
        run: |
          if pnpm nx show projects --affected --projects=docs --json | grep -q '"docs"'; then
            pnpm nx lighthouse docs --shard=${{ matrix.shard }}/3
          else
            echo "No change affects the docs."
          fi

      - if: github.event_name == 'push'
        run: pnpm nx lighthouse docs --shard=${{ matrix.shard }}/3

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docs-lighthouse-reports-${{ matrix.shard }}
          path: dist/lighthouse/docs
          if-no-files-found: ignore

  # ADR-0015: ng new, ndop init, ndop add dialog and ng build with npm, pnpm
  # and bun on Angular 22 and pnpm on Angular 21, against packages published
  # to a local Verdaccio, then ndop verify on a correct and a broken page
  # (ADR-0018), which renders in Chromium. Pull requests run it when they
  # affect the CLI, verify, core, primitives, schema or registry
  # (registry-e2e's implicit dependencies).
  registry-e2e:
    name: Registry install test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - run: pnpm install --frozen-lockfile

      # ndop verify's playwright-core uses the same browser build as the
      # workspace's Playwright.
      - run: pnpm exec playwright install --with-deps chromium

      - uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: master

      - if: github.event_name == 'pull_request'
        run: |
          if pnpm nx show projects --affected --projects=registry-e2e --json | grep -q '"registry-e2e"'; then
            pnpm nx e2e registry-e2e
          else
            echo "No change affects the registry install test."
          fi

      - if: github.event_name == 'push'
        run: pnpm nx e2e registry-e2e

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: registry-e2e-logs
          path: tmp/registry-e2e/*.log
          if-no-files-found: ignore

  # RFC-0001's CI matrix covers the previous Angular major and zone.js apps.
  # The workspace is pinned to Angular 22 and zoneless, so each variant swaps
  # dependencies in CI only and reruns the published Angular packages.
  compat:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Angular 21 with the TypeScript and CDK versions it supports
          # (ADR-0001); @angular/build 21 requires TypeScript below 6.0.
          - name: Angular 21
            targets: typecheck test build
            swap: >-
              typescript@5.9.3
              @angular/common@21.2.25 @angular/compiler@21.2.25
              @angular/core@21.2.25 @angular/forms@21.2.25
              @angular/platform-browser@21.2.25
              @angular/platform-server@21.2.25 @angular/router@21.2.25
              @angular/compiler-cli@21.2.25
              @angular/language-service@21.2.25
              @angular/build@21.2.24 @angular/cli@21.2.24
              @schematics/angular@21.2.24 @angular-devkit/core@21.2.24
              @angular/cdk@21.2.14 ng-packagr@21.2.7
          # Angular's test builder loads zone.js and switches TestBed to zone
          # change detection whenever zone.js resolves, so installing it is
          # the whole switch.
          - name: zone.js
            targets: test
            swap: zone.js@0.16.3
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The swapped versions can be younger than pnpm's minimum release age.
      - run: pnpm add -Dw --config.minimumReleaseAge=0 ${{ matrix.swap }}

      # Called directly: `pnpm nx` would recheck release age and reject the
      # swapped versions.
      - run: ./node_modules/.bin/nx run-many -t ${{ matrix.targets }} -p core primitives
