# path to a directory with all packages
storage: ../tmp/local-registry/storage

# a list of other known repositories we can talk to
uplinks:
  npmjs:
    url: https://registry.npmjs.org/
    maxage: 60m
    # The install test runs its cases in parallel, each installing a whole
    # app through this proxy. With the defaults (30s, 2 fails, 5m) two slow
    # tarballs mark npm offline for five minutes, and every package not yet
    # cached then 404s.
    timeout: 2m
    max_fails: 20
    fail_timeout: 10s

packages:
  '**':
    # give all users (including non-authenticated users) full access
    # because it is a local registry
    access: $all
    publish: $all
    unpublish: $all

    # if package is not available locally, proxy requests to npm registry
    proxy: npmjs

# log settings
log:
  type: stdout
  format: pretty
  level: warn

publish:
  allow_offline: true # set offline to true to allow publish offline
