<!doctype html>
<html lang="en" data-ndop-theme="system">
  <head>
    <meta charset="utf-8" />
    <title>Ndop UI</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Accessible Angular components you own and can still update, built for you and your agent."
    />
    <!-- Icons and the manifest are generated from the logo at build time
         (build/brand-assets.ts). The SVG favicon wins where supported. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The browser's and the installed app's bars: indigo, or the dark
         header's background in dark mode (ADR-0027). The app follows a
         scheme chosen on the site (site/preferences.ts). -->
    <meta
      name="theme-color"
      content="#1E3170"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0a0a0a"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="apple-mobile-web-app-title" content="Ndop" />
    <link rel="stylesheet" href="/src/styles.css" />
    <!-- Applies the saved theme and direction before the first paint, so a
         prerendered page never flashes; the app re-applies them on boot. -->
    <script>
      try {
        var root = document.documentElement;
        var theme = localStorage.getItem('ndop-theme');
        if (theme === 'light' || theme === 'dark') {
          root.removeAttribute('data-ndop-theme');
          root.classList.toggle('dark', theme === 'dark');
        }
        if (localStorage.getItem('ndop-dir') === 'rtl') root.dir = 'rtl';
      } catch (e) {}
    </script>
  </head>
  <body>
    <docs-root></docs-root>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
